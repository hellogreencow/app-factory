appId: com.iosappfactory.educationtracker
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "Calendar"
    timeout: 15000
- tapOn:
    id: "add-entry"
- extendedWaitUntil:
    visible:
      text: "Day Entry"
    timeout: 5000
- tapOn:
    id: "mood-great"
- tapOn:
    id: "input-note"
- inputText: "E2E test day"
- tapOn:
    id: "save-entry"
- extendedWaitUntil:
    visible:
      text: "Calendar"
    timeout: 5000
